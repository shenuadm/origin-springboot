# ===========================================
# Gateway 网关服务配置
# ===========================================
server:
  port: 8080

spring:
  application:
    name: origin-gateway

  # Redis 配置（用于限流、Token 黑名单等）
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:wzw123!@#}
      timeout: 5s
      connect-timeout: 5s
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          min-idle: 0
          max-idle: 10

  config:
    # 导入 Nacos 配置（Spring Cloud 2023+ 必需）
    import: optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      # 服务注册与发现
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      # 配置中心
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        # 共享配置
        shared-configs:
          - data-id: origin-common.yaml
            group: ${NACOS_GROUP:DEFAULT_GROUP}
            refresh: true

    gateway:
      # 开启日志
      logging:
        level:
          reactor.netty: INFO
          org.springframework.cloud.gateway: INFO
      # 全局跨域配置 (Spring Cloud Gateway 4.x)
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: false
                maxAge: 3600
      # 默认过滤器
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST
      # 路由配置
      routes:
        # 认证服务路由
        - id: origin-auth
          uri: lb://origin-web
          predicates:
            - Path=/auth/**
        # 管理后台路由
        - id: origin-admin
          uri: lb://origin-web
          predicates:
            - Path=/admin/**
        # 评论服务路由
        - id: origin-comment
          uri: lb://origin-web
          predicates:
            - Path=/comment/**
        # 文件服务路由
        - id: origin-file
          uri: lb://origin-web
          predicates:
            - Path=/file/**
        # 聊天室路由
        - id: origin-chat
          uri: lb://origin-web
          predicates:
            - Path=/chat/**

# ===========================================
# Gateway 安全配置
# ===========================================
origin:
  gateway:
    security:
      # 是否启用认证过滤器
      auth-enabled: true
      # 是否启用 SQL 注入过滤器
      sql-injection-enabled: true
      # 白名单路径（免 Token 认证）
      white-list:
        - /auth/**
        - /login
        - /swagger-ui/**
        - /v3/api-docs/**
        - /webjars/**
        - /doc.html
        - /favicon.ico
        - /error
        - /actuator/**

# JWT 配置
jwt:
  secret: ${JWT_SECRET:HpOdsqmwOqtJcq3AzargcLbYKTp7qijmrPv4Mx9rLbGcS2mB0USGdmsPYJXso9zTVzWA/Tmrh/iW1irD8nYYTQ==}
  issuer: origin-gateway
  tokenExpireTime: ${JWT_TOKEN_EXPIRE_TIME:120}
  rememberMeExpireTime: ${JWT_REMEMBER_ME_EXPIRE_TIME:10080}

# 日志配置
logging:
  level:
    com.cosmos.origin.gateway: DEBUG

# ===========================================
# 可观测性配置（Actuator + Prometheus + Tracing）
# ===========================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
