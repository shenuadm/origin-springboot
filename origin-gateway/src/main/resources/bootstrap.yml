# Bootstrap 配置 - 用于 Nacos 配置中心启动
spring:
  application:
    name: origin-gateway
  cloud:
    nacos:
      # 配置中心必须在 bootstrap 中配置，才能加载远程配置
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        # 启用配置中心
        enabled: true
